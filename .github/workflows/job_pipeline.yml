name: Job Pipeline

on:
  schedule:
    # 06:00 UTC = 08:00 Paris (heure d'été) / 07:00 Paris (heure d'hiver)
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer Chromium (StealthyFetcher / connecteur Indeed)
        run: python -m patchright install --with-deps chromium

      - name: Exécuter le pipeline
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python run.py

      - name: Committer la base de déduplication mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/jobs.db
          git diff --cached --quiet || git commit -m "chore: update dedup database [skip ci]"
          git push
