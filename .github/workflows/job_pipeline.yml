name: Job Pipeline

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter le pipeline
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        # --no-indeed : Indeed est bloqué par réputation IP sur les runners GitHub Actions
        # (StealthyFetcher/Chromium headless ne suffit pas à contourner un blocage réseau/edge).
        # Reste disponible en local (python run.py, sans le flag) où l'IP résidentielle passe.
        run: python run.py --no-indeed

      - name: Committer la base de déduplication mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/jobs.db
          git diff --cached --quiet || git commit -m "chore: update dedup database [skip ci]"
          git push
